server:
  port: 8082

spring:
  application:
    name: parkingTask3

  datasource:
    url: jdbc:mysql://mysql:3306/parkingmanagementsystem
    username: root
    password: 9600
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  config:
    import: "optional:configserver:http://configserver:8071/"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://eurekaserver:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

